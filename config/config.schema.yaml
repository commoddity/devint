description: "Developer Interface Configuration YAML: this file is used to configure the Developer Interface."
type: object
required:
  - git_config
  - llm_config
additionalProperties: false
properties:
  git_config:
    description: "Git configuration. This is used to configure your Git client for creating and pushing commits."
    type: object
    required:
      - personal_access_token
      - repo_owner
    additionalProperties: false
    properties:
      personal_access_token:
        description: "Valid Personal Access Token for GitHub. Should have at least `write` scope for `repo`."
        type: string
        pattern: "^(ghp_|gho_|ghu_|ghs_|ghr_|github_pat_)[a-zA-Z0-9_]{36,}$"
      repo_owner:
        description: "GitHub repository owner (organization or username) for pull request operations."
        type: string
      pr_summary_output_dir:
        description: "Optional directory path where PR summaries will be saved. If not set, summaries are not saved to disk."
        type: string
      company_name:
        description: "Company/organization name to filter from diffs sent to LLMs. This will be matched case-insensitively and removed from diffs before sending to LLM services. If not set, no company name filtering is performed."
        type: string
  llm_config:
    description: "LLM configuration. This is used to configure your LLM providers."
    type: object
    required:
      - default_llm_provider
      - llm_providers
    additionalProperties: false
    properties:
      default_llm_provider:
        description: "The default LLM provider to use. This may be overriden per-request using the `-p|--provider` flag."
        type: string
        enum:
          - "deepseek"
          - "openrouter"
          - "thaura"
      llm_providers:
        description: "LLM providers configuration. This is used to configure your LLM providers."
        type: object
        anyOf:
          - required: ["deepseek"]
          - required: ["openrouter"]
          - required: ["thaura"]
        additionalProperties: false
        properties:
          deepseek:
            description: "DeepSeek configuration."
            type: object
            required:
              - api_key
              - client_model
            additionalProperties: false
            properties:
              api_key:
                description: "API key for DeepSeek."
                type: string
              client_model:
                description: "Client model for DeepSeek. This may be overriden per-request using the `-m|--model` flag."
                type: string
                enum:
                  - "deepseek-chat"
                  - "deepseek-reasoner"
          openrouter:
            description: "OpenRouter configuration."
            type: object
            required:
              - api_key
              - client_model
            additionalProperties: false
            properties:
              api_key:
                description: "API key for OpenRouter."
                type: string
              client_model:
                description: "Client model for OpenRouter. This may be overriden per-request using the `-m|--model` flag. Any model string is valid. See https://openrouter.ai/models for available models."
                type: string
          thaura:
            description: "Thaura configuration."
            type: object
            required:
              - api_key
              - client_model
            additionalProperties: false
            properties:
              api_key:
                description: "API key for Thaura."
                type: string
              client_model:
                description: "Client model for Thaura. This may be overriden per-request using the `-m|--model` flag."
                type: string
                enum:
                  - "thaura"
